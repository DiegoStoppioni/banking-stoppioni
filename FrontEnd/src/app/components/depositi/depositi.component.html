<div class="page-container">
  <h2 class="page-title">Depositi</h2>
  <p class="page-subtitle">Gestisci i tuoi depositi</p>

  <div class="form-container">
    <div class="form-group">
      <label for="amount" style="color: white;">Importo</label>
      <input type="number" id="amount" [(ngModel)]="amount" placeholder="0.00">
    </div>
    <div class="form-group">
      <label for="description" style="color: white;">Descrizione</label>
      <input type="text" id="description" [(ngModel)]="description" placeholder="Es. Stipendio">
    </div>
    <button (click)="onDeposit()" class="btn-submit">Deposita</button>
  </div>
</div>
